name: Release source package

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - name: Tag must match DESCRIPTION
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v="$(Rscript -e 'cat(read.dcf("DESCRIPTION", "Version")[[1]])')"
          [[ "$TAG" == "v$v" ]] || { echo "tag $TAG != DESCRIPTION $v"; exit 1; }
      - uses: r-lib/actions/check-r-package@v2
        with:
          error-on: '"warning"'
          upload-snapshots: false
      - name: Build and attach tarball
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          R CMD build .
          gh release create "$TAG" "envharmonizer_${TAG#v}.tar.gz" --title "envharmonizer ${TAG#v}" --generate-notes
