# PR releases: prepare-pr opens a version-bump PR, merge it, then run publish
# straight away (publish tags the current main HEAD). Needs the RELEASE_PAT
# secret: Contents and Pull requests read/write on this repo.
name: Release

on:
  workflow_dispatch:
    inputs:
      release-mode:
        description: Prepare a release PR or publish the merged version
        type: choice
        options: [prepare-pr, publish]
        default: prepare-pr
      version-type:
        description: Version component to bump during PR preparation
        type: choice
        options: [patch, minor, major, dev]
        default: patch
      dry-run:
        description: Check only; do not push, open a PR, or publish
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    name: Release
    permissions:
      contents: write
    uses: seanthimons/baseline/.github/workflows/release-r-package.yaml@733a6e4554870ab2fa8dd7495fa67bea029bb38c # v1.3.0
    with:
      release-mode: ${{ inputs.release-mode }}
      version-type: ${{ inputs.version-type }}
      notes-mode: generate-notes
      dry-run: ${{ inputs.dry-run }}
    secrets:
      RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
